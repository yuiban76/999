name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          VITE_API_ORIGIN: https://life-online-api.yuiban76-life-online.workers.dev
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clear stale Pages deployment lock
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl --fail-with-body --silent --show-error -X POST
          -H "Accept: application/vnd.github+json"
          -H "Authorization: Bearer $GH_TOKEN"
          -H "X-GitHub-Api-Version: 2026-03-10"
          https://api.github.com/repos/${{ github.repository }}/pages/deployments/673201e27b2916dc88fe90bb53121b1630e972da/cancel

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
